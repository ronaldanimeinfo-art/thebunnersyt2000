<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TheBunnersYT - Stream en vivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0e0e10; font-family: 'Inter', system-ui, sans-serif; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    width: 100%;
    padding: 14px 20px;
    background: #18181b;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #9146FF;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #eb0400; animation: pulse 1.5s infinite; }
  header h1 { font-size: 16px; font-weight: 600; }
  header a { margin-left: auto; color: #9146FF; text-decoration: none; font-size: 13px; font-weight: 600; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main {
    width: 100%;
    max-width: 1100px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .info { padding: 16px 20px; color: #efeff1; }
  .info p { color: #adadb8; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>TheBunnersYT</h1>
    <a href="https://www.twitch.tv/thebunnersyt" target="_blank" rel="noopener">Ver en Twitch ↗</a>
  </header>
  <main>
    <div class="player-wrap">
      <iframe
        id="twitch-player"
        src=""
        allowfullscreen>
      </iframe>
    </div>
    <div class="info">
      <p>Reproductor incrustado del canal de Twitch de TheBunnersYT. Si aparece "offline" es porque el streamer no está transmitiendo en este momento.</p>
    </div>
  </main>

  <script>
    // Twitch exige que el dominio (host) exacto desde donde se sirve la página
    // se pase como parámetro "parent". Lo detectamos automáticamente aquí,
    // así funciona sin tocar el código sin importar en qué dominio la publiques.
    var host = window.location.hostname || "localhost";
    var iframe = document.getElementById('twitch-player');
    iframe.src = "https://player.twitch.tv/?channel=thebunnersyt&parent=" + host + "&muted=false";
  </script>
</body>
</html>
